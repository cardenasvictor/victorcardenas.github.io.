    <!-- Three.js from CDN (r128 for compatibility) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
    // Scene, Camera, Renderer setup
    const container = document.getElementById('globe-container');
    
    const scene = new THREE.Scene();
    
    // Camera
    const camera = new THREE.PerspectiveCamera(
        45,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
    );
    camera.position.z = 3;

    // Renderer with antialiasing
    const renderer = new THREE.WebGLRenderer({ 
        antialias: true,
        alpha: true 
    });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Texture Loader
    const loader = new THREE.TextureLoader();
    
    // THREE.JS OFFICIAL TEXTURES (working CDN paths)
    const earthTexture = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthNormalMap = loader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
    const earthSpecularMap = loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
    const earthLightsTexture = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const cloudTexture = loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');

    // Enable anisotropic filtering for maximum sharpness
    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
    
    // Add error handling for textures
    earthTexture.onError = () => console.warn('Failed to load earth texture');
    earthNormalMap.onError = () => console.warn('Failed to load normal map');
    earthSpecularMap.onError = () => console.warn('Failed to load specular map');
    earthLightsTexture.onError = () => console.warn('Failed to load lights texture');
    cloudTexture.onError = () => console.warn('Failed to load cloud texture');
    
    earthTexture.anisotropy = maxAnisotropy;
    earthNormalMap.anisotropy = maxAnisotropy;
    earthSpecularMap.anisotropy = maxAnisotropy;
    earthLightsTexture.anisotropy = maxAnisotropy;
    cloudTexture.anisotropy = maxAnisotropy;

    // Earth geometry
    const earthGeometry = new THREE.SphereGeometry(1, 64, 64);

    // Earth material - simplified for reliability
    const earthMaterial = new THREE.MeshPhongMaterial({
        map: earthTexture,
        normalMap: earthNormalMap,
        specularMap: earthSpecularMap,
        shininess: 1000
    });

    const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earthMesh);

    // Cloud layer
    const cloudGeometry = new THREE.SphereGeometry(1.01, 64, 64);
    const cloudMaterial = new THREE.MeshPhongMaterial({
        map: cloudTexture,
        transparent: true,
        opacity: 0.4,
        depthWrite: false
    });
    const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
    scene.add(cloudMesh);

    // Atmospheric glow
    const atmosphereGeometry = new THREE.SphereGeometry(1.15, 64, 64);
    const atmosphereMaterial = new THREE.ShaderMaterial({
        uniforms: {
            c: { value: 0.2 },
            p: { value: 6.0 },
            glowColor: { value: new THREE.Color(0x4db2ff) },
            viewVector: { value: camera.position }
        },
        vertexShader: `
            uniform vec3 viewVector;
            varying float intensity;
            void main() {
                vec3 vNormal = normalize(normalMatrix * normal);
                vec3 vNormel = normalize(normalMatrix * viewVector);
                intensity = pow(0.6 - dot(vNormal, vNormel), 4.0);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform vec3 glowColor;
            varying float intensity;
            void main() {
                vec3 glow = glowColor * intensity;
                gl_FragColor = vec4(glow, intensity * 0.8);
            }
        `,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true
    });
    const atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
    scene.add(atmosphereMesh);

    // LIGHTING - optimized for vibrant greens and crystal oceans
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.32);  // Slightly increased
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.7);  // Increased intensity
    directionalLight.position.set(-5, -3, 3);  // Bottom-right as requested
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    // Mouse interaction
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotationVelocity = { x: 0, y: 0 };

    renderer.domElement.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            rotationVelocity.y = deltaMove.x * 0.005;
            rotationVelocity.x = deltaMove.y * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }
    });

    renderer.domElement.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // No loading text needed

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);

        if (!isDragging) {
            rotationVelocity.x *= 0.95;
            rotationVelocity.y *= 0.95;
            
            if (Math.abs(rotationVelocity.x) < 0.001 && Math.abs(rotationVelocity.y) < 0.001) {
                earthMesh.rotation.y += 0.001;
                cloudMesh.rotation.y += 0.0012;
            }
        }

        earthMesh.rotation.x += rotationVelocity.x;
        earthMesh.rotation.y += rotationVelocity.y;
        cloudMesh.rotation.x += rotationVelocity.x;
        cloudMesh.rotation.y += rotationVelocity.y;

        renderer.render(scene, camera);
    }
    animate();

    // Responsive resize
    window.addEventListener('resize', () => {
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        
        renderer.setSize(width, height);
    });
    </script>
